<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Cumpleaños Mi Amor ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .hearts {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .heart {
            position: absolute;
            font-size: 20px;
            color: rgba(255, 255, 255, 0.4);
            animation: float 8s ease-in infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100vh) rotate(720deg) scale(1.2);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 40px 20px;
            color: white;
            animation: fadeInDown 1s ease;
        }

        .header h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 2px 2px 4px rgba(0,0,0,0.3), 0 0 20px rgba(255,255,255,0.5); }
            to { text-shadow: 2px 2px 4px rgba(0,0,0,0.3), 0 0 40px rgba(255,255,255,0.9), 0 0 60px rgba(255,182,193,0.8); }
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.95;
            margin-top: 10px;
        }

        .photo-counter {
            text-align: center;
            color: white;
            font-size: 1.1em;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .gallery-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.3);
            animation: fadeInUp 1s ease 0.3s both;
        }

        .photo-frame {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto 25px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 50px rgba(0,0,0,0.2);
            border: 5px solid white;
        }

        .photo-frame img {
            width: 100%;
            height: 500px;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .photo-frame:hover img {
            transform: scale(1.05);
        }

        .message-box {
            background: linear-gradient(135deg, #ffeef8 0%, #e8f4f8 100%);
            border-radius: 20px;
            padding: 30px;
            margin-top: 20px;
            min-height: 180px;
            position: relative;
            border-left: 5px solid #667eea;
            animation: fadeIn 0.5s ease;
        }

        .message-box::before {
            content: '"';
            font-size: 5em;
            color: #667eea;
            position: absolute;
            top: -20px;
            left: 20px;
            opacity: 0.2;
            font-family: Georgia, serif;
        }

        .message-text {
            font-size: 1.15em;
            line-height: 1.9;
            color: #444;
            text-align: center;
            font-style: italic;
            position: relative;
            z-index: 1;
            font-family: 'Poppins', sans-serif;
        }

        .message-text strong {
            color: #764ba2;
            display: block;
            margin-top: 15px;
            font-style: normal;
            font-size: 0.95em;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 30px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.1em;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-nav {
            width: 50px;
            height: 50px;
            padding: 0;
            border-radius: 50%;
            justify-content: center;
            font-size: 1.5em;
        }

        .indicators {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 25px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ddd;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dot.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transform: scale(1.3);
        }

        .final-message {
            text-align: center;
            margin-top: 40px;
            padding: 30px;
            background: rgba(255,255,255,0.15);
            border-radius: 20px;
            color: white;
            backdrop-filter: blur(10px);
            animation: fadeInUp 1s ease 0.6s both;
        }

        .final-message h2 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5em;
            margin-bottom: 15px;
        }

        .final-message p {
            font-size: 1.1em;
            line-height: 1.8;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 2.5em;
            }
            .photo-frame img {
                height: 350px;
            }
            .message-text {
                font-size: 1em;
            }
            .btn {
                padding: 12px 25px;
                font-size: 1em;
            }
        }

        .music-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255,255,255,0.9);
            border: none;
            cursor: pointer;
            font-size: 1.8em;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            z-index: 100;
            transition: all 0.3s ease;
        }

        .music-btn:hover {
            transform: scale(1.1);
        }

        .music-btn.playing
